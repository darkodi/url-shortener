services:
  # ============================================================
  # SHARD 1: Primary + 2 Replicas (Ports 5432-5434)
  # ============================================================
  postgres-shard1-primary:
    image: postgres:16-alpine
    container_name: postgres-shard1-primary
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urlshortener
    command: |
      postgres
      -c wal_level=replica
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
      -c listen_addresses='*'
    ports:
      - "5432:5432"
    volumes:
      - postgres_shard1_primary_data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - url-shortener-network

  postgres-shard1-replica1:
    image: postgres:16-alpine
    container_name: postgres-shard1-replica1
    environment:
      POSTGRES_PASSWORD: password
    command: >
      bash -c '
      echo "Waiting for primary to be ready...";
      until pg_isready -h postgres-shard1-primary -U urlshortener -d urlshortener; do sleep 1; done;
      echo "Removing old data...";
      rm -rf /var/lib/postgresql/data/*;
      echo "Creating base backup from primary...";
      until PGPASSWORD=password pg_basebackup -h postgres-shard1-primary -U urlshortener -D /var/lib/postgresql/data -Fp -Xs -P -R; do
        echo "Base backup failed, retrying in 2s...";
        sleep 2;
      done;
      echo "Base backup complete!";
      chmod 0700 /var/lib/postgresql/data;
      chown -R postgres:postgres /var/lib/postgresql/data;
      echo "Starting replica...";
      exec postgres;
      '
    user: postgres
    depends_on:
      postgres-shard1-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - postgres_shard1_replica1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
