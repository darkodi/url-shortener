  # ============================================================
  # REDIS CACHE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - url-shortener-network

  # ============================================================
  # APPLICATION (Will update in next commit)
  # ============================================================
  url-shortener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener
    depends_on:
      postgres-shard1-primary:
        condition: service_healthy
      postgres-shard2-primary:
        condition: service_healthy
      postgres-shard3-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # We'll update these in next commit
      DB_DRIVER: postgres
      DB_HOST: postgres-shard1-primary
      DB_PORT: 5432
      DB_USER: urlshortener
      DB_PASSWORD: password
      DB_NAME: urlshortener
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      DB_REPLICA_HOSTS: postgres-shard1-replica1,postgres-shard1-replica2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
      ENVIRONMENT: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      RATE_LIMIT_ENABLED: true
      RATE_LIMIT_RATE: 10
      RATE_LIMIT_BURST: 20
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - url-shortener-network

volumes:
  # Shard 1
  postgres_shard1_primary_data:
  postgres_shard1_replica1_data:
  postgres_shard1_replica2_data:
  # Shard 2
  postgres_shard2_primary_data:
  postgres_shard2_replica1_data:
  postgres_shard2_replica2_data:
  # Shard 3
  postgres_shard3_primary_data:
  postgres_shard3_replica1_data:
  postgres_shard3_replica3_data:
  # Redis
  redis_data:

networks:
  url-shortener-network:
    driver: bridge
